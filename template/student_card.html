<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บัตรนักเรียน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-sm bg-gradient-to-br from-indigo-900 via-indigo-800 to-slate-900 text-white rounded-3xl p-6 shadow-2xl space-y-5 border border-white/10">
        <div class="flex justify-between items-center border-b border-white/10 pb-3">
            <div>
                <h1 class="text-sm font-bold">โรงเรียนสาธิตการศึกษา</h1>
                <p class="text-[10px] text-indigo-200">STUDENT IDENTIFICATION CARD</p>
            </div>
            <span class="text-xs font-semibold bg-white/10 px-2.5 py-1 rounded-full text-indigo-200">{{ s['grade'] or 'ม.6' }}</span>
        </div>

        <div class="flex items-center gap-4">
            {% if s['profile_img'] %}
                <img src="/static/uploads/{{ s['profile_img'] }}" class="w-20 h-20 rounded-2xl object-cover border-2 border-indigo-400/50 shadow-md">
            {% else %}
                <div class="w-20 h-20 rounded-2xl bg-indigo-700/50 flex items-center justify-center text-3xl font-bold border border-white/10">🎓</div>
            {% endif %}
            <div class="space-y-1">
                <p class="text-[9px] text-indigo-300">ชื่อ - นามสกุล</p>
                <h2 class="text-sm font-bold text-white leading-tight">{{ s['fullname'] }}</h2>
                <p class="text-[9px] text-indigo-300 mt-1">รหัสนักเรียน</p>
                <p class="text-xs font-mono font-semibold text-indigo-200">{{ s['student_id'] }}</p>
            </div>
        </div>

        <div class="bg-white/5 rounded-2xl p-3 flex justify-between items-center border border-white/5">
            <div class="space-y-1">
                <p class="text-[9px] text-indigo-300">สถานะบัตร: <span class="text-emerald-400 font-semibold">{{ s['status'] or 'รอตรวจสอบ' }}</span></p>
                <p class="text-[9px] text-indigo-300">สแกนเพื่อตรวจสอบความถูกต้อง</p>
            </div>
            <div id="qrcode" class="bg-white p-1.5 rounded-xl"></div>
        </div>
    </div>

    <div class="mt-6 flex gap-3">
        <button onclick="window.print()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs py-2.5 px-5 rounded-xl font-medium transition shadow-sm">🖨️ พิมพ์บัตร</button>
        <a href="/student" class="bg-white hover:bg-slate-200 text-slate-700 text-xs py-2.5 px-5 rounded-xl font-medium transition shadow-sm">← กลับหน้าโปรไฟล์</a>
    </div>

    <script>
        new QRCode(document.getElementById("qrcode"), {
            text: "{{ verify_url }}",
            width: 55,
            height: 55
        });
    </script>
</body>
</html>
