<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการข้อมูลนักเรียน</title>
    <!-- ใช้ Tailwind CSS ผ่าน CDN เพื่อความสะดวกรวดเร็ว -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <!-- หัวข้อระบบ -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">🏫 ระบบจัดการข้อมูลนักเรียน</h1>
            <p class="text-sm text-gray-500 mt-1">กรุณาเข้าสู่ระบบเพื่อใช้งาน</p>
        </div>

        <!-- ฟอร์ม Login -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อผู้ใช้งาน (Username)</label>
                <input type="text" id="username" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="กรอกชื่อผู้ใช้งาน">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน (Password)</label>
                <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="กรอกรหัสผ่าน">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition duration-200 font-medium">เข้าสู่ระบบ</button>
        </form>

        <!-- ลิงก์สลับไปหน้าสมัครสมาชิก -->
        <div class="text-center mt-6">
            <p class="text-sm text-gray-600">ยังไม่มีบัญชีใช่ไหม? <a href="#" id="toggleBtn" class="text-blue-600 hover:underline font-medium">ลงทะเบียนนักเรียนใหม่</a></p>
        </div>
    </div>

    <script>
        // โค้ด JavaScript เบื้องต้นสำหรับการสลับหน้าหรือจัดการฟอร์ม (เดี๋ยวเรามาเชื่อมต่อ API ทีหลัง)
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            alert('กำลังเข้าสู่ระบบด้วยชื่อ: ' + username);
        });
    </script>

</body>
</html>
