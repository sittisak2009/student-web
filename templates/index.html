<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบบันทึกข้อมูลนักเรียน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="bg-gradient-to-br from-pink-100 via-purple-100 to-indigo-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <div class="bg-white/80 p-6 rounded-3xl shadow text-center border border-pink-200">
            <h1 class="text-2xl font-bold text-purple-700">✨ ระบบบันทึกข้อมูลนักเรียน ✨</h1>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-3xl shadow border border-purple-100">
                <h2 class="text-lg font-semibold text-purple-700 mb-4">เพิ่มนักเรียน</h2>
                <form action="/add" method="POST" class="space-y-4">
                    <input type="text" name="student_id" placeholder="เลขประจำตัว" required class="w-full p-2.5 rounded-xl border outline-none text-sm">
                    <input type="text" name="fullname" placeholder="ชื่อ-นามสกุล" required class="w-full p-2.5 rounded-xl border outline-none text-sm">
                    <button type="submit" class="w-full py-2.5 bg-purple-500 hover:bg-purple-600 text-white rounded-xl text-sm font-medium">บันทึก</button>
                </form>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow border border-purple-100 md:col-span-2">
                <h2 class="text-lg font-semibold text-purple-700 mb-4">รายชื่อนักเรียน</h2>
                <table class="w-full text-left text-sm">
                    <thead class="bg-purple-50 text-purple-600">
                        <tr><th class="p-2">เลขประจำตัว</th><th class="p-2">ชื่อ-นามสกุล</th><th class="p-2">เวลา</th></tr>
                    </thead>
                    <tbody>
                        {% for s in students %}
                        <tr class="border-b">
                            <td class="p-2 font-semibold text-purple-600">{{ s[1] }}</td>
                            <td class="p-2">{{ s[2] }}</td>
                            <td class="p-2 text-xs text-gray-400">{{ s[3] }}</td>
                        </tr>
                        {% else %}
                        <tr><td colspan="3" class="p-4 text-center text-gray-400">ยังไม่มีข้อมูล</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
                  </html>
