<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลส่วนตัวนักเรียน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">
    <div class="max-w-xl mx-auto space-y-6">
        
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-slate-800">👋 สวัสดี, {{ student[3] }}</h1>
                <p class="text-xs text-slate-500">รหัสนักเรียน: <span class="font-semibold text-indigo-600">{{ student[1] }}</span></p>
            </div>
            <a href="/logout" class="bg-red-50 text-red-600 hover:bg-red-100 text-xs py-2 px-3 rounded-xl font-medium transition">
                🚪 ออกจากระบบ
            </a>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
            <h2 class="text-lg font-semibold text-slate-700 border-b pb-2">📋 กรอก/แก้ไขข้อมูลส่วนตัว</h2>
            
            <form action="/student/update" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-500 mb-1">ชื่อ-นามสกุล</label>
                    <input type="text" name="fullname" value="{{ student[3] }}" required class="w-full p-3 bg-slate-50 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-500 mb-1">ระดับชั้น / ห้อง</label>
                    <input type="text" name="grade" value="{{ student[4] or '' }}" placeholder="เช่น ม.6/1" class="w-full p-3 bg-slate-50 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-500 mb-1">เบอร์โทรศัพท์ติดต่อ</label>
                    <input type="text" name="phone" value="{{ student[5] or '' }}" placeholder="08X-XXX-XXXX" class="w-full p-3 bg-slate-50 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-500 mb-1">ที่อยู่ปัจจุบัน</label>
                    <textarea name="address" rows="3" placeholder="บ้านเลขที่ ถนน ซอย ตำบล..." class="w-full p-3 bg-slate-50 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">{{ student[6] or '' }}</textarea>
                </div>
                
                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium transition shadow-sm">
                    💾 บันทึกข้อมูล
                </button>
            </form>
            
            {% if student[7] %}
            <p class="text-right text-[10px] text-slate-400">อัปเดตล่าสุดเมื่อ: {{ student[7] }}</p>
            {% endif %}
        </div>

    </div>
</body>
</html>
