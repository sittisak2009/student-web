<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บัตรประจำตัวนักเรียน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QR Code & html2canvas Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- บัตรนักเรียน -->
    <div id="card-area" class="w-full max-w-sm bg-gradient-to-br from-indigo-900 via-indigo-800 to-slate-900 text-white rounded-3xl p-6 shadow-2xl space-y-5 border border-white/10 relative overflow-hidden">
        
        <div class="flex justify-between items-center border-b border-white/10 pb-3">
            <div>
                <h1 class="text-sm font-bold tracking-wide">โรงเรียนสาธิตการศึกษา</h1>
                <p class="text-[10px] text-indigo-200">STUDENT IDENTIFICATION CARD</p>
            </div>
            <span class="text-xs font-semibold bg-white/10 px-2.5 py-1 rounded-full text-indigo-200">{{ s[4] or 'ม.6' }}</span>
        </div>

        <div class="flex items-center gap-4">
            {% if s[9] %}
                <img src="/static/uploads/{{ s[9] }}" class="w-20 h-20 rounded-2xl object-cover border-2 border-indigo-400/50 shadow-md">
            {% else %}
                <div class="w-20 h-20 rounded-2xl bg-indigo-700/50 flex items-center justify-center text-3xl font-bold border border-white/10">{{ s[3][0] }}</div>
            {% endif %}
            <div class="space-y-1">
                <p class="text-[9px] text-indigo-300">ชื่อ - นามสกุล</p>
                <h2 class="text-sm font-bold text-white leading-tight">{{ s[3] }}</h2>
                <p class="text-[9px] text-indigo-300 mt-1">รหัสนักเรียน</p>
                <p class="text-xs font-mono font-semibold tracking-wider text-indigo-200">{{ s[1] }}</p>
            </div>
        </div>

        <!-- QR Code และข้อมูลส่วนตัว -->
        <div class="bg-white/5 rounded-2xl p-3 flex justify-between items-center border border-white/5">
            <div class="space-y-1">
                <p class="text-[9px] text-indigo-300">สถานะบัตร: <span class="text-emerald-400 font-semibold">ปกติ</span></p>
                <p class="text-[9px] text-indigo-300">ส่วนสูง/น้ำหนัก: <span class="text-indigo-100 font-semibold">{{ s[7] or '-' }} ซม. / {{ s[8] or '-' }} กก.</span></p>
            </div>
            <!-- กล่องแสดง QR Code -->
            <div id="qrcode" class="bg-white p-1.5 rounded-xl shadow-md"></div>
        </div>

        <div class="flex justify-between items-center text-[9px] text-indigo-300 pt-1 border-t border-white/10">
            <span>ISSUED BY SCHOOL SYSTEM</span>
            <span class="font-mono">2026</span>
        </div>
    </div>

    <!-- ปุ่มควบคุม -->
    <div class="mt-6 flex flex-wrap gap-3 justify-center">
        <button onclick="downloadPNG()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs py-2.5 px-5 rounded-xl font-medium transition shadow-md">🖼️ ดาวน์โหลดรูปบัตร (PNG)</button>
        <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs py-2.5 px-5 rounded-xl font-medium transition shadow-sm">🖨️ พิมพ์บัตร</button>
        <a href="/student" class="bg-white hover:bg-slate-200 text-slate-700 text-xs py-2.5 px-5 rounded-xl font-medium transition shadow-sm">← กลับ</a>
    </div>

    <script>
        // เจน QR Code สำหรับสแกนตรวจสอบ
        new QRCode(document.getElementById("qrcode"), {
            text: "{{ verify_url }}",
            width: 55,
            height: 55
        });

        // ฟังก์ชันดาวน์โหลดบัตรเป็นรูป PNG
        function downloadPNG() {
            const card = document.getElementById("card-area");
            html2canvas(card, { scale: 3 }).then(canvas => {
                const link = document.createElement("a");
                link.download = "student_card_{{ s[1] }}.png";
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }
    </script>

</body>
        </html>
