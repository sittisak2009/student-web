<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตรวจสอบสถานะนักเรียน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-3xl shadow-lg border border-slate-200 max-w-sm w-full text-center space-y-4">
        {% if s %}
            <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">✓</div>
            <h1 class="text-lg font-bold text-slate-800">บัตรนักเรียนถูกต้อง</h1>
            <div class="bg-slate-50 p-4 rounded-2xl text-xs space-y-2 text-left border">
                <p><strong class="text-slate-600">ชื่อ-นามสกุล:</strong> {{ s[1] }}</p>
                <p><strong class="text-slate-600">รหัสนักเรียน:</strong> {{ s[0] }}</p>
                <p><strong class="text-slate-600">ชั้นเรียน:</strong> {{ s[2] or '-' }}</p>
                <p><strong class="text-slate-600">สถานะในระบบ:</strong> <span class="text-emerald-600 font-semibold">{{ s[3] }}</span></p>
            </div>
        {% else %}
            <div class="w-16 h-16 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">✕</div>
            <h1 class="text-lg font-bold text-slate-800">ไม่พบข้อมูลนักเรียน</h1>
            <p class="text-xs text-slate-500">บัตรนี้อาจไม่อยู่ในระบบ หรือถูกลบออกไปแล้ว</p>
        {% endif %}
    </div>

</body>
</html>
