<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนนักเรียน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-3xl shadow-lg border border-slate-200 w-full max-w-md space-y-6">
        <div class="text-center">
            <h1 class="text-2xl font-bold text-slate-800">📝 ลงทะเบียนนักเรียน</h1>
            <p class="text-xs text-slate-500 mt-1">สร้างบัญชีสำหรับนักเรียนใหม่</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="p-3 rounded-xl text-xs font-medium text-center bg-rose-50 text-rose-700 border border-rose-200">
                  {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/register" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">รหัสนักเรียน</label>
                <input type="text" name="student_id" placeholder="เช่น 6601001" required class="w-full p-3 bg-slate-50 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">ชื่อ-นามสกุล</label>
                <input type="text" name="fullname" placeholder="นายสมชาย ใจดี" required class="w-full p-3 bg-slate-50 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">รหัสผ่าน</label>
                <input type="password" name="password" placeholder="ตั้งรหัสผ่านสำหรับเข้าสู่ระบบ" required class="w-full p-3 bg-slate-50 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-semibold transition shadow-md">
                ยืนยันลงทะเบียน
            </button>
        </form>

        <div class="text-center pt-2">
            <a href="/login" class="text-xs text-slate-500 hover:underline">← ย้อนกลับไปหน้าเข้าสู่ระบบ</a>
        </div>
    </div>
</body>
</html>
