<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ระบบจัดการข้อมูลนักเรียน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-3xl shadow-lg border border-slate-200 w-full max-w-md space-y-6">
        
        <div class="text-center space-y-1">
            <h1 class="text-2xl font-bold text-slate-800">🎓 เข้าสู่ระบบ</h1>
            <p class="text-slate-500 text-xs">กรอกข้อมูลเพื่อเข้าใช้งานระบบนักเรียน/ครู</p>
        </div>

        <!-- แถบแสดงข้อความแจ้งเตือนความผิดพลาด -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="p-3.5 rounded-xl text-xs font-medium border text-center
                  {% if category == 'success' %}bg-emerald-50 text-emerald-700 border-emerald-200
                  {% elif category == 'error' %}bg-rose-50 text-rose-700 border-rose-200
                  {% else %}bg-sky-50 text-sky-700 border-sky-200{% endif %}">
                  {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/login" method="POST" class="space-y-4">
            
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">ประเภทผู้ใช้งาน</label>
                <select name="role" class="w-full p-3 bg-slate-50 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="student">👨‍🎓 นักเรียน</option>
                    <option value="teacher">👨‍🏫 ครูประจำชั้น / แอดมิน</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">ชื่อผู้ใช้ / รหัสนักเรียน</label>
                <input type="text" name="username" required placeholder="กรอกรหัสนักเรียน หรือ admin" class="w-full p-3 bg-slate-50 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">รหัสผ่าน</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full p-3 bg-slate-50 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold transition shadow-md">
                เข้าสู่ระบบ
            </button>
        </form>

        <div class="text-center border-t pt-4">
            <p class="text-xs text-slate-500">ยังไม่มีบัญชีนักเรียน? <a href="/register" class="text-indigo-600 font-semibold hover:underline">ลงทะเบียนที่นี่</a></p>
        </div>

    </div>

</body>
</html>
