<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ระบบจัดการข้อมูลนักเรียน</title>
    <!-- ใช้ Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-100 via-purple-50 to-blue-100 flex items-center justify-center min-h-screen font-sans">

    <div class="bg-white/80 backdrop-blur-lg p-8 rounded-3xl shadow-2xl w-full max-w-md border border-white/60 transform transition-all">
        <!-- หัวข้อระบบพร้อมไอคอนเด่นๆ -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl mb-4 shadow-inner text-3xl">
                🏫
            </div>
            <h1 class="text-2xl font-extrabold text-gray-800 tracking-tight">ระบบจัดการข้อมูลนักเรียน</h1>
            <p class="text-sm text-gray-500 mt-1">ยินดีต้อนรับกลับมา กรุณาเข้าสู่ระบบ</p>
        </div>

        <!-- ฟอร์ม Login -->
        <form action="/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-2">ชื่อผู้ใช้งาน (Username)</label>
                <input type="text" name="username" required 
                    class="w-full px-4 py-3 bg-gray-50/70 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all duration-200 text-sm" 
                    placeholder="กรอกชื่อผู้ใช้งาน">
            </div>
            
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-2">รหัสผ่าน (Password)</label>
                <input type="password" name="password" required 
                    class="w-full px-4 py-3 bg-gray-50/70 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all duration-200 text-sm" 
                    placeholder="กรอกรหัสผ่าน">
            </div>

            <button type="submit" 
                class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white py-3.5 rounded-xl hover:from-blue-700 hover:to-indigo-700 shadow-lg shadow-blue-500/30 transition-all duration-300 font-semibold text-sm transform hover:-translate-y-0.5">
                เข้าสู่ระบบ
            </button>
        </form>

        <!-- ลิงก์สมัครสมาชิก -->
        <div class="text-center mt-8 pt-6 border-t border-gray-100">
            <p class="text-sm text-gray-500">ยังไม่มีบัญชีใช่ไหม? <a href="/register" class="text-blue-600 hover:text-blue-700 font-semibold transition-colors">ลงทะเบียนนักเรียนใหม่</a></p>
        </div>
    </div>

</body>
</html>
