<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-md border border-slate-200 w-full max-w-md space-y-6">
        <div class="text-center space-y-1">
            <h1 class="text-2xl font-bold text-slate-800">🔒 เข้าสู่ระบบ</h1>
            <p class="text-xs text-slate-500">ระบบข้อมูลนักเรียน</p>
        </div>

        {% if error %}
        <div class="bg-red-50 text-red-600 text-xs p-3 rounded-xl text-center border border-red-100">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">ประเภทผู้ใช้งาน</label>
                <select name="role" class="w-full p-3 bg-slate-50 border rounded-xl outline-none text-sm font-medium">
                    <option value="student">👨‍🎓 นักเรียน</option>
                    <option value="teacher">👨‍🏫 ครู / ผู้ดูแลระบบ</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">รหัสนักเรียน / Username</label>
                <input type="text" name="username" required placeholder="เช่น 6601001 หรือ admin" class="w-full p-3 bg-slate-50 border rounded-xl outline-none text-sm">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">รหัสผ่าน</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full p-3 bg-slate-50 border rounded-xl outline-none text-sm">
            </div>
            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium transition shadow-sm">
                เข้าสู่ระบบ
            </button>
        </form>

        <div class="text-center pt-2 border-t text-xs">
            <span class="text-slate-500">นักเรียนยังไม่มีบัญชี? </span>
            <a href="/register" class="text-indigo-600 font-semibold hover:underline">ลงทะเบียนที่นี่</a>
        </div>
    </div>
</body>
</html>
