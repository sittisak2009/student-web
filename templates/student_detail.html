<!-- โครงสร้างไฟล์สรุปย่อ -->
<div class="max-w-4xl mx-auto bg-white p-8 rounded-3xl shadow-lg">
    <h1 class="text-xl font-bold mb-4">ข้อมูลนักเรียน: {{ s['fullname'] }}</h1>
    <p>ที่อยู่: {{ s['address'] or 'ไม่ได้ระบุ' }}</p>
    <p>เบอร์โทร: {{ s['phone'] or 'ไม่ได้ระบุ' }}</p>
    <h2 class="mt-6 font-bold">ประวัติบันทึกส่วนสูง/น้ำหนัก</h2>
    <table class="w-full mt-2">
        {% for h in history %}
        <tr class="border-b">
            <td class="p-2">{{ h['recorded_at'] }}</td>
            <td class="p-2">สูง {{ h['height'] }} ซม. / หนัก {{ h['weight'] }} กก.</td>
        </tr>
        {% endfor %}
    </table>
    <a href="/teacher" class="mt-6 block text-indigo-600">← กลับแดชบอร์ด</a>
</div>
