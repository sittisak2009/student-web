<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เปลี่ยนรหัสผ่าน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-md border border-slate-200 w-full max-w-md space-y-6">
        <h1 class="text-xl font-bold text-slate-800 text-center">🔑 เปลี่ยนรหัสผ่าน</h1>

        {% if msg %}<div class="bg-emerald-50 text-emerald-600 text-xs p-3 rounded-xl text-center">{{ msg }}</div>{% endif %}
        {% if error %}<div class="bg-red-50 text-red-600 text-xs p-3 rounded-xl text-center">{{ error }}</div>{% endif %}

        <form action="/change_password" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">รหัสผ่านเดิม</label>
                <input type="password" name="old_pass" required class="w-full p-3 bg-slate-50 border rounded-xl text-sm outline-none">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">รหัสผ่านใหม่</label>
                <input type="password" name="new_pass" required class="w-full p-3 bg-slate-50 border rounded-xl text-sm outline-none">
            </div>
            <button type="submit" class="w-full py-3 bg-indigo-600 text-white rounded-xl text-sm font-medium hover:bg-indigo-700">
                ยืนยันการเปลี่ยนรหัสผ่าน
            </button>
        </form>
        <div class="text-center"><a href="/student" class="text-xs text-slate-500 hover:underline">← กลับไปหน้านักเรียน</a></div>
    </div>
</body>
</html>
